name: Read content of hello.txt on push

on:
  push:
    branches:
      - main

jobs:
  read-hello-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Read and print content of hello.txt
        run: |
          echo Content of hello.txt:
          cat hello.txt